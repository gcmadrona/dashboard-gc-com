<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard GC & Comunicação | Madrona Advogados</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --azul:#00b2ff;
  --grafite:#444444;
  --cinza:#b2bab9;
  --vermelho:#fc745c;
  --verde:#8fd694;
  --amarelo:#fff6d3;
  --bg:#f4f5f6;
  --card:#ffffff;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--grafite);
}
header{
  background:var(--grafite);
  color:#ffffff;
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  border-bottom:1px solid #333;
}
.brand{
  display:flex;
  align-items:center;
  gap:16px;
}
.brand-mark{
  display:flex;
  align-items:center;
}
.brand-mark img{
  height:56px;
  display:block;
}
.brand-title{
  font-size:14px;
  font-weight:400;
  color:#d8d8d8;
  border-left:1px solid #666;
  padding-left:16px;
}
.upload-area{
  display:flex;
  align-items:center;
  gap:10px;
}
.upload-btn{
  background:var(--azul);
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.upload-btn:hover{ opacity:0.9; }
#fileStatus{
  font-size:12px;
  color:#d8d8d8;
}
#lastUpdate{
  font-size:11px;
  color:var(--cinza);
}
nav.tabs{
  display:flex;
  background:#fff;
  border-bottom:2px solid #eee;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:50;
}
nav.tabs button{
  background:none;
  border:none;
  padding:14px 20px;
  font-size:13.5px;
  font-weight:600;
  color:var(--grafite);
  cursor:pointer;
  white-space:nowrap;
  border-bottom:3px solid transparent;
}
nav.tabs button.active{
  color:var(--azul);
  border-bottom:3px solid var(--azul);
}
.subtabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.subtabs button{
  background:#fff;
  border:1px solid #ddd;
  padding:8px 16px;
  border-radius:20px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  color:var(--grafite);
}
.subtabs button.active{
  background:var(--grafite);
  color:#fff;
  border-color:var(--grafite);
}
main{
  padding:24px 28px 60px;
  max-width:1500px;
  margin:0 auto;
}
.page{ display:none; }
.page.active{ display:block; }
.subpage{ display:none; }
.subpage.active{ display:block; }

.empty-state{
  text-align:center;
  padding:80px 20px;
  color:var(--cinza);
}
.empty-state h2{ color:var(--grafite); }

.hero{
  background:var(--grafite);
  border-radius:10px;
  padding:26px;
  color:#fff;
  margin-bottom:22px;
}
.hero.com{ background:#0a3a5c; }
.hero-title{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--cinza);
  margin-bottom:14px;
}
.hero-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px;
}
.hero-num{ font-size:30px; font-weight:700; }
.hero-lbl{ font-size:12px; color:#d8d8d8; margin-top:4px; }

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:22px;
}
.kpi-card{
  background:var(--card);
  border-radius:10px;
  padding:18px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
  border-left:4px solid var(--azul);
}
.kpi-card .val{ font-size:26px; font-weight:700; color:var(--grafite); }
.kpi-card .lbl{ font-size:12px; color:#888; margin-top:4px; }

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:20px;
}
.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:18px;
  margin-bottom:20px;
}
@media(max-width:900px){
  .grid2, .grid3{ grid-template-columns:1fr; }
}
.card{
  background:var(--card);
  border-radius:10px;
  padding:18px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
}
.card h3{
  margin:0 0 14px;
  font-size:14px;
  color:var(--grafite);
  border-bottom:1px solid #eee;
  padding-bottom:8px;
}
.chart-wrap{ position:relative; height:280px; }
.chart-wrap.tall{ height:360px; }

table.data-table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
}
table.data-table th{
  background:#f0f1f2;
  text-align:left;
  padding:8px 10px;
  position:sticky;
  top:0;
}
table.data-table td{
  padding:7px 10px;
  border-bottom:1px solid #eee;
}
table.data-table tr:hover td{ background:#fafafa; }
.table-scroll{ max-height:400px; overflow-y:auto; }

.progress-row{ margin-bottom:14px; }
.progress-row .plbl{
  display:flex;
  justify-content:space-between;
  font-size:12.5px;
  margin-bottom:4px;
}
.progress-bar-bg{
  background:#eee;
  border-radius:6px;
  height:10px;
  overflow:hidden;
}
.progress-bar-fill{
  background:var(--azul);
  height:100%;
  border-radius:6px;
}
footer{
  text-align:center;
  font-size:11.5px;
  color:var(--cinza);
  padding:20px;
}
</style>
</head>

<script>
/* =========================================================
   DASHBOARD GC & COMUNICAÇÃO - MADRONA ADVOGADOS
   ========================================================= */

const PALETTE = ['#00b2ff','#fc745c','#8fd694','#fff6d3','#b2bab9','#444444','#7fd1ff','#ffb3a3'];

// Ajuste aqui o total contratado de créditos/consultas do upMiner (usado para calcular o % restante de contrato).
const UPMINER_CONTRACT_TOTAL = 30573;

const TABS = [
  { id:'geral', label:'Visão Geral' },
  { id:'publicacoes', label:'Publicações' },
  { id:'redes', label:'Redes & Mailing' },
  { id:'academiamadrona', label:'Academia e Treinamentos' },
  { id:'academia', label:'Grupos de Estudos e RT' },
  { id:'lexjuris', label:'Lex & Juris' },
  { id:'timesheet', label:'Timesheet Madrona Lab' },
  { id:'ferramentas', label:'Ferramentas' },
  { id:'labcoins', label:'Lab Coins' },
  { id:'aquisicoes', label:'Aquisições' },
];

let WORKBOOK = null;
let CHARTS = {};
let DATA = {}; // parsed data cache

function destroyChart(id){
  if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; }
}
function makeChart(canvasId, config){
  destroyChart(canvasId);
  const el = document.getElementById(canvasId);
  if(!el) return;
  CHARTS[canvasId] = new Chart(el.getContext('2d'), config);
}

/* ---------- Sheet helpers ---------- */
function getSheetNames(){ return WORKBOOK ? WORKBOOK.SheetNames : []; }

function findSheet(nameGuess){
  const names = getSheetNames();
  const norm = s => s.trim().toLowerCase();
  let hit = names.find(n => norm(n) === norm(nameGuess));
  if(!hit) hit = names.find(n => norm(n).includes(norm(nameGuess)));
  return hit ? WORKBOOK.Sheets[hit] : null;
}

// Returns array-of-arrays (raw), skipping fully empty rows at the end
function sheetToRows(ws){
  if(!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
}

// Build array of objects using row0 as headers (trimmed strings), from a given start row (default 0)
function rowsToObjects(rows, startRow=0){
  if(!rows || rows.length===0) return [];
  const headers = rows[startRow].map(h => (h===null||h===undefined) ? '' : String(h).trim());
  const out = [];
  for(let i=startRow+1;i<rows.length;i++){
    const row = rows[i];
    if(!row || row.every(c=>c===null||c==='')) continue;
    const obj = {};
    headers.forEach((h,idx)=>{ if(h) obj[h] = row[idx]===undefined? null : row[idx]; });
    out.push(obj);
  }
  return out;
}

function colIndex(headers, name){
  return headers.findIndex(h => (h||'').toString().trim().toLowerCase() === name.toLowerCase());
}

function num(v){
  if(v===null||v===undefined||v==='') return 0;
  const n = parseFloat(String(v).toString().replace(',','.'));
  return isNaN(n) ? 0 : n;
}

function fmtInt(n){ return Math.round(n).toLocaleString('pt-BR'); }
function fmtMoney(n){ return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); }
function fmtPct(n){ return (n*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }

const MESES_ORDER = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function monthKeyFromDate(d){
  if(d instanceof Date && !isNaN(d)) return MESES_ORDER[d.getMonth()];
  return null;
}
function excelDateToJS(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    const parsed = XLSX.SSF.parse_date_code(v);
    if(parsed) return new Date(parsed.y, parsed.m-1, parsed.d);
  }
  if(typeof v === 'string'){
    const d = new Date(v);
    if(!isNaN(d)) return d;
  }
  return null;
}

function topN(arr, n){ return arr.slice(0,n); }

function groupSum(objects, keyField, valFn){
  const map = {};
  objects.forEach(o=>{
    const k = o[keyField]===undefined||o[keyField]===null||o[keyField]==='' ? 'Não informado' : String(o[keyField]).trim();
    map[k] = (map[k]||0) + valFn(o);
  });
  return map;
}

function sortedEntries(map, desc=true){
  return Object.entries(map).sort((a,b)=> desc ? b[1]-a[1] : a[1]-b[1]);
}

// Retorna { row, index } do último registro com valor não nulo/indefinido no campo informado
function latestValid(rows, field){
  for(let i=rows.length-1;i>=0;i--){
    const v = rows[i][field];
    if(v!==null && v!==undefined && v!=='') return { row:rows[i], index:i };
  }
  return null;
}
function previousValid(rows, beforeIndex, field){
  for(let i=beforeIndex-1;i>=0;i--){
    const v = rows[i][field];
    if(v!==null && v!==undefined && v!=='') return { row:rows[i], index:i };
  }
  return null;
}
function monthNamePT(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[d.getMonth()];
}
function classifyPosicao(pos){
  const p = (pos||'').toString().toLowerCase();
  if(p.includes('estagi')) return 'Estagiário';
  if(p.includes('sócio') || p.includes('socio')) return 'Sócio';
  if(p.includes('sênior') || p.includes('senior') || /\bsr\b/.test(p)) return 'Sênior';
  if(p.includes('pleno')) return 'Pleno';
  if(p.includes('júnior') || p.includes('junior') || /\bjr\b/.test(p)) return 'Júnior';
  return 'ADM';
}

const MES_ABBR_ORDER = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MES_ABBR_MAP = {jan:'Jan',fev:'Fev',mar:'Mar',abr:'Abr',mai:'Mai',jun:'Jun',jul:'Jul',ago:'Ago',set:'Set',out:'Out',nov:'Nov',dez:'Dez'};
function monthAbbrPT(val){
  if(val instanceof Date && !isNaN(val)) return MES_ABBR_ORDER[val.getMonth()];
  if(typeof val === 'string'){
    const k = val.trim().slice(0,3).toLowerCase();
    return MES_ABBR_MAP[k] || val.trim();
  }
  return '';
}

// Cruzamento pessoas x UN, a partir da aba CT (não exibida como aba de resultado)
function getCTMap(){
  if(DATA.ctMap) return DATA.ctMap;
  const ct = getCT();
  const map = {};
  ct.forEach(r=>{
    const nome = (r['NOME']||'').toString().trim().toLowerCase();
    if(nome) map[nome] = r['UN'] || 'Não informado';
  });
  DATA.ctMap = map;
  return map;
}
function unForName(name){
  const map = getCTMap();
  const key = (name||'').toString().trim().toLowerCase();
  return map[key] || 'Não informado';
}
function normalizeName(name){
  return (name||'').toString().trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
}

/* ---------- Navigation ---------- */
let ACTIVE_TAB = 'geral';
let ACTIVE_SUB = { geral:'gc', ferramentas:'lexter' };

function renderTabsNav(){
  const nav = document.getElementById('mainTabs');
  nav.innerHTML = TABS.map(t=>
    `<button data-tab="${t.id}" class="${t.id===ACTIVE_TAB?'active':''}">${t.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ ACTIVE_TAB = btn.dataset.tab; renderAll(); });
  });
}

function emptyState(msg){
  return `<div class="empty-state"><h2>Carregue a planilha para visualizar este painel</h2><p>${msg||''}</p></div>`;
}

function renderAll(){
  renderTabsNav();
  const main = document.getElementById('mainContent');
  if(!WORKBOOK){
    main.innerHTML = emptyState('Use o botão "Carregar planilha (.xlsx)" no topo da página.');
    return;
  }
  switch(ACTIVE_TAB){
    case 'geral': main.innerHTML = pageGeralHTML(); afterRenderGeral(); break;
    case 'publicacoes': main.innerHTML = pagePublicacoesHTML(); afterRenderPublicacoes(); break;
    case 'redes': main.innerHTML = pageRedesHTML(); afterRenderRedes(); break;
    case 'academiamadrona': main.innerHTML = pageAcademiaMadronaHTML(); afterRenderAcademiaMadrona(); break;
    case 'academia': main.innerHTML = pageAcademiaHTML(); afterRenderAcademia(); break;
    case 'lexjuris': main.innerHTML = pageLexJurisHTML(); afterRenderLexJuris(); break;
    case 'timesheet': main.innerHTML = pageTimesheetHTML(); afterRenderTimesheet(); break;
    case 'ferramentas': main.innerHTML = pageFerramentasHTML(); afterRenderFerramentas(); break;
    case 'labcoins': main.innerHTML = pageLabCoinsHTML(); afterRenderLabCoins(); break;
    case 'aquisicoes': main.innerHTML = pageAquisicoesHTML(); afterRenderAquisicoes(); break;
  }
}

function subtabsHTML(tabId, subs){
  return `<div class="subtabs">${subs.map(s=>
    `<button data-sub="${s.id}" class="${ACTIVE_SUB[tabId]===s.id?'active':''}">${s.label}</button>`

function computeDocuCertisignSummary(){
  if(DATA.docuCertiSummary) return DATA.docuCertiSummary;
  const ws = findSheet('Docusign & Certisign') || findSheet('Docusign e Certisign') || findSheet('Docusign');
  const rows = ws ? sheetToRows(ws) : [];
  if(!rows.length){ DATA.docuCertiSummary = null; return null; }
  const result = { certisign:{contratados:0,disponiveis:0,usados:0}, docusign:{contratados:0,disponiveis:0,usados:0} };
  let current = null;
  rows.forEach(r=>{
    if(!r) return;
    const label = (r[0]||'').toString().trim().toUpperCase();
    if(!label) return;
    if(label==='CERTISIGN'){ current='certisign'; return; }
    if(label==='DOCUSIGN'){ current='docusign'; return; }
    if(!current) return;
    const val = num(r[1]);
    if(label.includes('CONTRATAD')) result[current].contratados = val;
    else if(label.includes('DISPONIV')) result[current].disponiveis = val;
    else if(label.includes('USADO')) result[current].usados = val;
  });
  DATA.docuCertiSummary = result;
  return result;
}

function computeUpMinerSummary(){
  const rows = getUpMiner();
  const totalBD = rows.filter(r=>(r['ÁREA']||'').toString().trim().toUpperCase()==='BD').reduce((s,r)=>s+num(r['TOTAL']),0);
  const totalCT = rows.filter(r=>(r['ÁREA']||'').toString().trim().toUpperCase()==='CT').reduce((s,r)=>s+num(r['TOTAL']),0);
  const totalUsado = totalBD + totalCT;
  const pctBD = UPMINER_CONTRACT_TOTAL ? totalBD/UPMINER_CONTRACT_TOTAL : 0;
  const pctCT = UPMINER_CONTRACT_TOTAL ? totalCT/UPMINER_CONTRACT_TOTAL : 0;
  const pctRestante = UPMINER_CONTRACT_TOTAL ? Math.max(0, 1 - (totalUsado/UPMINER_CONTRACT_TOTAL)) : 0;
  return { totalBD, totalCT, totalUsado, pctBD, pctCT, pctRestante };
}

function computeMailingGrowth(){
  const mail = getMailling();
  const totalRow = mail.find(r=>(r['Area']||'').toString().trim().toLowerCase()==='todos');
  if(!totalRow) return null;
  const monthCols = Object.keys(totalRow).filter(k=>k!=='Area');
  let baseKey=null, baseVal=null, latestKey=null, latestVal=null;
  monthCols.forEach(k=>{
    const v = totalRow[k];
    if(v!==null && v!==undefined && v!==''){
      if(baseKey===null){ baseKey=k; baseVal=num(v); }
      latestKey=k; latestVal=num(v);
    }
  });
  if(baseVal===null || latestVal===null) return null;
  return { baseKey, baseVal, latestKey, latestVal, pct:(latestVal-baseVal)/baseVal };
}

function monthGrowthCard(rows, field, label){
  const latest = latestValid(rows, field);
  if(!latest) return `<div class="kpi-card"><div class="val">-</div><div class="lbl">${label}</div></div>`;
  const prev = previousValid(rows, latest.index, field);
  const mesNome = monthNamePT(excelDateToJS(latest.row['Mês']));
  if(!prev){
    return `<div class="kpi-card"><div class="val">-</div><div class="lbl">${label}, crescimento no mês: ${mesNome}</div></div>`;
  }
  const pct = (num(latest.row[field]) - num(prev.row[field])) / num(prev.row[field]);
  return `<div class="kpi-card"><div class="val">${pct>=0?'+':''}${fmtPct(pct)}</div><div class="lbl">${label}, crescimento no mês: ${mesNome}</div></div>`;
}

function monthValueCard(rows, field, label){
  const latest = latestValid(rows, field);
  if(!latest) return `<div class="kpi-card"><div class="val">-</div><div class="lbl">${label}</div></div>`;
  const mesNome = monthNamePT(excelDateToJS(latest.row['Mês']));
  return `<div class="kpi-card"><div class="val">${fmtInt(num(latest.row[field]))}</div><div class="lbl">${label}: ${mesNome}</div></div>`;
}

/* =========================================================
   PÁGINA: LAB COINS (Madrona Star)
   ========================================================= */
function computeLabCoinsSummary(){
  const rows = getLabCoins();
  const empty = { items:[], totalCoins:0, totalOrc:0, totalPremioMes:0 };
  if(!rows || rows.length<2) return empty;
  const header = rows[0];
  const idxUN = colIndex(header,'UN');
  const idxEnt = colIndex(header,'Entregável');
  const idxCoins = colIndex(header,'LAB COINS');
  const idxOrc = colIndex(header,'Orçamento total');
  const idxPremioEsp = colIndex(header,'Prêmio especial');
  const idxPremioMes = colIndex(header,'Prêmios mensais');

  const items = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;
    const un = idxUN>=0 ? r[idxUN] : null;
    const ent = idxEnt>=0 ? r[idxEnt] : null;
    if(!un && !ent) continue;
    items.push({
      un: un || 'Não informado',
      ent: ent || '',
      coins: idxCoins>=0 ? num(r[idxCoins]) : 0,
      orcamento: idxOrc>=0 ? num(r[idxOrc]) : 0,
      premioEsp: idxPremioEsp>=0 ? num(r[idxPremioEsp]) : 0,
      premioMes: idxPremioMes>=0 ? num(r[idxPremioMes]) : 0,
    });
  }
  return {
    items,
    totalCoins: items.reduce((s,r)=>s+r.coins,0),
    totalOrc: items.reduce((s,r)=>s+r.orcamento,0),
    totalPremioMes: items.reduce((s,r)=>s+r.premioMes,0),
  };
}
